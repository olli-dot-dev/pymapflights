[project]
name = "pymapflights"
description = "Asynchronous Python client for the map.flights API (unofficial)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Olli", email = "1@olli.dev" }]
requires-python = ">=3.12"
dynamic = ["version"]
keywords = ["map.flights", "ads-b", "aircraft", "flights", "home-assistant", "async"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "aiohttp>=3.9.0",
  "mashumaro>=3.13",
  "yarl>=1.9.0",
]

[project.urls]
Homepage = "https://github.com/olli-dot-dev/pymapflights"
Issues = "https://github.com/olli-dot-dev/pymapflights/issues"

[dependency-groups]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pymapflights/const.py"
pattern = 'VERSION: Final = "(?P<version>[^"]+)"'

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=pymapflights --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # conflicts with the formatter
  "CPY001", # no per-file copyright headers, see LICENSE
  "D203",   # one-blank-line-before-class (incompatible with D211)
  "D213",   # multi-line-summary-second-line (incompatible with D212)
  "EM101",
  "EM102",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D", "ANN401", "SLF001"]
